name: 功能请求
description: 提交带设计说明的功能提案，而不是「请帮我做这个」的愿望清单。
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Issue 跟踪器仅接受**带设计说明**的功能提案。提问或一般讨论请使用
        [Discussions](https://github.com/Deep-Spark/iluvatar-agent-skills/discussions)。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个功能解决什么问题？为什么重要？
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: 设计方案
      description: |
        期望如何工作？请说明行为、涉及的 Skill/文档，以及用户侧入口。
        需要的是一份设计，而不是愿望清单。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 还评估过哪些做法？为什么当前方案更好？
    validations:
      required: false

  - type: dropdown
    id: skill
    attributes:
      label: 涉及的 Skill
      description: 若提案针对现有 Skill，请选择名称；新 Skill 请求选「新 Skill / 不适用」。
      options:
        - iluvatar-cuda-base
        - iluvatar-ixrt
        - iluvatar-ixjpeg
        - iluvatar-ixcodec
        - tools-ixkncli-guide
        - tools-ixkn-perf-analysis
        - 新 Skill / 不适用
        - 不确定 / 其他（请在描述中说明）
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 类别
      options:
        - 新 Skill 请求
        - 现有 Skill 能力增强
        - 安装 / 分发（npx skills）
        - 文档 / 可发现性
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认不是重复提交
          required: true
        - label: 这是带设计说明的提案，而不是「请帮我做这个」的请求
          required: true
